version: 2.1

orbs:
  general-platform-helpers: okta/general-platform-helpers@1
  platform-helpers: okta/platform-helpers@1
  python: circleci/python@2.0.3
  aws-cli: circleci/aws-cli@5.1

parameters:
  go-version:
    type: string
    default: "1.26.4"
  go-sha256:
    type: string
    default: "1153d3d50e0ac764b447adfe05c2bcf08e889d42a02e0fe0259bd47f6733ad7f"
  python-version:
    type: string
    default: "3.11.5"

jobs:
  snyk-scan:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    steps:
      - checkout
      # Download Go, check its checksum, and install it
      - run:
          name: Install Go
          command: |
            curl -L -O https://go.dev/dl/go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz
            echo "<< pipeline.parameters.go-sha256 >>  go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz" | sha256sum -c -
            sudo tar -C /usr/local -xzf go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz
            echo 'export PATH=$PATH:/usr/local/go/bin' >> "$BASH_ENV"
  
      - general-platform-helpers/step-load-dependencies
      - general-platform-helpers/step-run-snyk-monitor:
          scan-all-projects: true
          skip-unresolved: true
          run-on-non-main: true

  reversing-labs:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install Python
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
            sudo pip install --upgrade pip
      - run:
          name: Download Reverse Labs Scanner
          command: |
            curl https://dso-resources.oktasecurity.com/scanner \
              -H "x-api-key: $DSO_RLSECURE_TOKEN" \
              --output rl_wrapper-0.0.2+35ababa-py3-none-any.whl
      - run:
          name: Install RL Wrapper
          command: |
            pip install ./rl_wrapper-0.0.2+35ababa-py3-none-any.whl
      - aws-cli/setup:
          profile_name: default
          role_arn: $AWS_ARN
          region: us-east-1
      - run: >-
          eval "$(aws configure export-credentials --profile default --format env)" 2> /dev/null
      - run:
          name: Install Go
          command: |
            curl -L -O https://go.dev/dl/go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz
            echo "<< pipeline.parameters.go-sha256 >>  go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz" | sha256sum -c -
            sudo tar -C /usr/local -xzf go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz
            echo 'export PATH=$PATH:/usr/local/go/bin' >> "$BASH_ENV"
      - run:
          name: Build binary to scan
          command: |
            make build
      - run:
          name: Run Reversing Labs Wrapper Scanner
          command: |
            
            rl-wrapper \
              --artifact ${CIRCLE_WORKING_DIRECTORY/#\~/$HOME}/terraform-provider-oktapam \
              --name $CIRCLE_PROJECT_REPONAME\
              --version $CIRCLE_SHA1\
              --repository $CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME \
              --commit $CIRCLE_SHA1 \
              --build-env "circleci" \
              --suppress_output
  unit-tests:
    docker:
      - image: cimg/go:<< pipeline.parameters.go-version >>
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: |
            make test

workflows:
  tests:
    jobs:
      - unit-tests:
          name: run-unit-tests
  semgrep:
    jobs:
      - platform-helpers/job-semgrep-scan:
          name: "Scan with Semgrep"
          context:
            - static-analysis
  snyk:
    jobs:
      - snyk-scan:
          name: execute-snyk
          context:
            - static-analysis
  "Malware Scanner":
    jobs:
      - reversing-labs:
          context:
            - static-analysis
